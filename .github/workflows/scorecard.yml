name: Scorecard

# OpenSSF (Linux Foundation) security best-practices score (0–10).
# Publishes a public result + badge at api.securityscorecards.dev.
on:
  branch_protection_rule:
  schedule:
    - cron: '0 7 * * 1'   # weekly
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # v2.4.4 — pulls its image from ghcr.io; v2.4.0 used gcr.io, which Google
        # has shut down (pulls fail with a "billing required" error).
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: results.sarif
